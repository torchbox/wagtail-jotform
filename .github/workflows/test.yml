name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        django:
          [
            "django>=4.2,<4.3",
            "django>=5.1,<5.2",
            "django>=5.2,<5.3",
            "django>=6.0,<6.1",
          ]
        wagtail:
          [
            "wagtail>=7.0,<7.1",
            "wagtail>=7.1,<7.2",
            "wagtail>=7.2,<7.3",
            "wagtail>=7.3,<7.4",
            "wagtail>=7.4,<7.5",
          ]
        exclude:
          # Python 3.14 requires Wagtail 7.2+ (older Wagtails cap Python at 3.13)
          - python: "3.14"
            wagtail: "wagtail>=7.0,<7.1"
          - python: "3.14"
            wagtail: "wagtail>=7.1,<7.2"

          # Django 4.2 is dropped from Wagtail 7.4
          - django: "django>=4.2,<4.3"
            wagtail: "wagtail>=7.4,<7.5"

          # Django 5.1 is only supported by Wagtail 7.0, 7.1, 7.2
          - django: "django>=5.1,<5.2"
            wagtail: "wagtail>=7.3,<7.4"
          - django: "django>=5.1,<5.2"
            wagtail: "wagtail>=7.4,<7.5"

          # Django 6.0 is only supported by Wagtail 7.2+
          - django: "django>=6.0,<6.1"
            wagtail: "wagtail>=7.0,<7.1"
          - django: "django>=6.0,<6.1"
            wagtail: "wagtail>=7.1,<7.2"

        include:
          - python: "3.14"
            django: "django>=6.0,<6.1"
            wagtail: "wagtail>=7.4,<7.5"
            latest: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/setup.cfg"
      - run: |
          pip install -e .
          pip install coverage
          pip install "${{ matrix.wagtail }}"
          pip install "${{ matrix.django }}"
      - run: |
          coverage run ./runtests.py
          coverage report
          coverage xml
      - if: ${{ matrix.latest }}
        uses: codecov/codecov-action@v4
        with:
          name: Python 3.14
