[tox]
skipsdist = True
usedevelop = True
skip_missing_interpreters = True

envlist =
    python{310,311,312}-django42-wagtail{70,72,73}
    python{310,311,312,313}-django52-wagtail70
    python{310,311,312,313,314}-django52-wagtail{72,73,74}
    python{312,313,314}-django60-wagtail{72,73,74}

[testenv]
install_command = pip install -e ".[testing]" -U {opts} {packages}

commands =
    coverage run ./runtests.py
    coverage report

deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    wagtail70: wagtail>=7.0,<7.1
    wagtail72: wagtail>=7.2,<7.3
    wagtail73: wagtail>=7.3,<7.4
    wagtail74: wagtail>=7.4,<7.5
    coverage

basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
